name: Update Box Office Grosses

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 8 AM UTC
  workflow_dispatch:        # manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-grosses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest grosses and patch index.html
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python update_grosses.py

      - name: Commit and push if changed
        run: |
          git diff --quiet index.html && echo "No changes" && exit 0
          git config user.name  "Box Office Bot"
          git config user.email "bot@chi-alpha-fantasy.com"
          git add index.html
          git commit -m "📊 Auto-sync from Google Sheet $(date -u +'%Y-%m-%d')"
          git push
